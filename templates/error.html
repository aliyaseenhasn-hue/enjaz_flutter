{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>إنجاز – خطأ</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 50%, #f8fffe 100%);
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .error-card {
      max-width: 400px;
      width: 100%;
      background: white;
      border-radius: 32px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.08);
      border: 1px solid #ccfbf1;
      position: relative;
      overflow: hidden;
    }
    .error-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0; left: 0;
      height: 5px;
      background: linear-gradient(90deg, #0d9488, #0ea5e9);
    }
    .error-icon {
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, #fef2f2, #fecaca);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      position: relative;
    }
    .error-icon::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px dashed #fecaca;
      animation: spin 12s linear infinite;
    }
    .error-icon i {
      font-size: 2.5rem;
      color: #ef4444;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 12px;
    }
    .error-message {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0d9488, #0ea5e9);
      color: white;
      border: none;
      padding: 13px 24px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Tajawal', sans-serif;
      box-shadow: 0 4px 16px rgba(13,148,136,0.3);
      transition: all 0.25s;
    }
    .btn-primary:hover {
      box-shadow: 0 6px 24px rgba(13,148,136,0.4);
      transform: translateY(-2px);
    }
    .btn-outline {
      background: white;
      border: 2px solid #e2e8f0;
      color: #0f172a;
      padding: 13px 24px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Tajawal', sans-serif;
      transition: all 0.25s;
    }
    .btn-outline:hover {
      border-color: #0d9488;
      color: #0d9488;
      background: #f0fdfa;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon">
      <i class="fa-solid fa-circle-exclamation"></i>
    </div>
    <h1 class="error-title">عذراً! 😔</h1>
    <div class="error-message">
      {{ message|default:"حدث خطأ غير متوقع.<br>يرجى المحاولة مرة أخرى لاحقاً." }}
    </div>
    <div class="btn-group">
      <a href="javascript:history.back()" class="btn-outline">
        <i class="fa-solid fa-arrow-right"></i> العودة
      </a>
      <a href="/" class="btn-primary">
        <i class="fa-solid fa-house"></i> الرئيسية
      </a>
    </div>
  </div>
</body>
</html>
