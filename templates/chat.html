{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>إنجاز – المحادثات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    .page-container { max-width: 600px; margin: 0 auto; padding: 0 0 90px; }
    
    .page-header {
      background: white;
      padding: 16px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    
    .page-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .page-title i { color: #0d9488; }
    
    .conversations-list { padding: 12px 16px; }
    
    .conv-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
      background: white;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    
    .conv-item:hover {
      border-color: #0d9488;
      box-shadow: 0 4px 16px rgba(13,148,136,0.12);
      transform: translateX(-4px);
    }
    
    .conv-item:active { transform: scale(0.98); }
    
    .conv-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f0fdfa, #e0f2fe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: #0d9488;
      flex-shrink: 0;
      border: 2px solid #ccfbf1;
    }
    
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-size: 0.95rem; font-weight: 800; color: #0f172a; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-last { font-size: 0.78rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; flex-shrink: 0; }
    
    .whatsapp-contact-btn {
      background: #25d366;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    
    .whatsapp-contact-btn:hover { background: #128c7e; transform: scale(1.05); }
    
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: #94a3b8;
    }
    
    .empty-state-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #f0fdfa, #e0f2fe);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 2rem;
      color: #0d9488;
    }
    
    .empty-state h3 { font-size: 1.1rem; font-weight: 800; color: #64748b; margin-bottom: 8px; }
    .empty-state p { font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="page-container">
  <div class="page-header">
    <button class="back-btn" onclick="window.history.length > 1 ? window.history.back() : window.location.href='/'" style="margin:0; padding:8px 12px;">
      <i class="fa-solid fa-arrow-right"></i>
      العودة
    </button>
    <div class="page-title">
      <i class="fa-solid fa-comments"></i>
      المحادثات
    </div>
    <div style="width:80px;"></div>
  </div>

  <div class="conversations-list" id="chat-list">
    <div style="text-align:center; padding:40px; color:#94a3b8;">💬 جاري تحميل المحادثات...</div>
  </div>
</div>

<nav class="bottom-tab-bar">
  <a href="/profileuser/" class="tab-item"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
  <a href="/service-requests/" class="tab-item"><i class="fa-solid fa-briefcase"></i><span>دليل المهن</span></a>
  <a href="/create-request/" class="tab-item"><i class="fa-solid fa-plus-circle"></i><span>طلب جديد</span></a>
  <a href="/create-request/?tab=tracking" class="tab-item"><i class="fa-solid fa-list-check"></i><span>طلباتي</span></a>
  <a href="/chat/" class="tab-item active"><i class="fa-solid fa-envelope"></i><span>الرسائل</span></a>
  <a href="/settings/" class="tab-item"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
</nav>

<script>
  const token = localStorage.getItem('enjaz_pwa_token');
  if (!token) { alert('يرجى تسجيل الدخول أولاً.'); window.location.href = '/singin/'; }

  function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
  }

  function toWhatsApp(phone) {
    if (!phone) return null;
    const d = phone.replace(/\D/g, '');
    return d.startsWith('964') ? d : '964' + d.substring(1);
  }

  fetch('/api/services/chat/conversations/', { headers: { 'Authorization': 'Bearer ' + token } })
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(list => {
    const el = document.getElementById('chat-list');
    if (!Array.isArray(list) || !list.length) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">💬</div>
          <h3>لا توجد محادثات</h3>
          <p>ستظهر محادثاتك مع مقدمي الخدمات هنا.</p>
        </div>`;
      return;
    }
    el.innerHTML = list.map(item => {
      const whatsappLink = item.phone_number ? `https://wa.me/${toWhatsApp(item.phone_number)}` : '#';
      return `
        <div class="conv-item" data-title="${escapeHtml(item.title || '')}">
          <div class="conv-avatar">${(item.title || 'م').charAt(0)}</div>
          <div class="conv-info">
            <div class="conv-name">${escapeHtml(item.title || 'محادثة')}</div>
            <div class="conv-last">${escapeHtml(item.last_message || item.status_display || '')}</div>
          </div>
          <div class="conv-actions">
            ${item.phone_number ? `<a href="${whatsappLink}" target="_blank" class="whatsapp-contact-btn"><i class="fab fa-whatsapp"></i> واتساب</a>` : ''}
          </div>
        </div>`;
    }).join('');
  })
  .catch(() => {
    document.getElementById('chat-list').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">❌</div>
        <h3>فشل تحميل المحادثات</h3>
        <p>حاول مرة أخرى لاحقاً.</p>
      </div>`;
  });
</script>
</body>
</html>
